{% extends 'azblog/base.html' %}
{% block title %}{{ post.title }} {% endblock %}
{% block content %}

<div class="mt-4">
    <h2>Edit Blog</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Confirm Changes</button>
    </form>
</div>


{% endblock %}
