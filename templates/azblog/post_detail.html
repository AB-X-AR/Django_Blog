{% extends 'azblog/base.html' %}

{% block title %}{{ post.title }} - AZ Blog{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 p-4 mb-5">
  <h1 class="fw-bold mb-2">{{ post.title }}</h1>
  <small class="text-muted">
    By: {{ post.author }}
  </small>
  <hr>
  <div class="mt-3">
    {{ post.content }}
  </div>
  <div class="mt-4">
    <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm">← Back to Home</a>
  </div>
  <div class="mt-4">
    
    <a href="{% url 'post_update' post.pk %}">Edit this Post</a>
  </div>

</div>

{% endblock %}
